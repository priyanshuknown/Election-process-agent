{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="glass-card p-5 animate-fade-in">
                <div class="text-center mb-4">
                    <h2 class="fw-bold"><i class="bi bi-person-check-fill text-primary"></i> Am I Eligible?</h2>
                    <p class="text-muted">Fill out this quick form to see if you can vote.</p>
                </div>

                <form id="eligibility-form">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Are you an Indian Citizen?</label>
                        <select class="form-select form-select-lg" id="citizen-select" required>
                            <option value="">Select option...</option>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">How old are you? (or will be on Jan 1st of election year)</label>
                        <input type="number" class="form-control form-control-lg" id="age-input" placeholder="e.g. 18" required min="1">
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 btn-lg">Check Eligibility</button>
                </form>

                <div id="result-box" class="mt-4 text-center d-none p-4 rounded-3">
                    <h3 id="result-title" class="fw-bold mb-2"></h3>
                    <p id="result-text" class="mb-0"></p>
                    <a href="/journey" id="result-btn" class="btn btn-success mt-3 d-none">Start Registration Journey</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('eligibility-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const isCitizen = document.getElementById('citizen-select').value === 'yes';
    const age = parseInt(document.getElementById('age-input').value, 10);
    
    const resultBox = document.getElementById('result-box');
    const resultTitle = document.getElementById('result-title');
    const resultText = document.getElementById('result-text');
    const resultBtn = document.getElementById('result-btn');
    
    resultBox.classList.remove('d-none', 'bg-success-subtle', 'bg-danger-subtle', 'bg-warning-subtle');
    resultBtn.classList.add('d-none');
    
    if (!isCitizen) {
        resultBox.classList.add('bg-danger-subtle');
        resultTitle.innerText = "Not Eligible ❌";
        resultTitle.className = "fw-bold mb-2 text-danger";
        resultText.innerText = "Only Indian citizens are eligible to vote in Indian elections.";
    } else if (age < 18) {
        resultBox.classList.add('bg-warning-subtle');
        resultTitle.innerText = "Almost There! ⏳";
        resultTitle.className = "fw-bold mb-2 text-warning text-dark";
        resultText.innerText = `You need to be at least 18 years old to vote. Wait for ${18 - age} more year(s)!`;
    } else {
        resultBox.classList.add('bg-success-subtle');
        resultTitle.innerText = "You are Eligible! 🎉";
        resultTitle.className = "fw-bold mb-2 text-success";
        resultText.innerText = "Great news! You meet the criteria to vote. Let's get you registered.";
        resultBtn.classList.remove('d-none');
    }
});
</script>
{% endblock %}
