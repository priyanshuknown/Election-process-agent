<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteMate - Smart Election Guide</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-box-seam-fill me-2"></i>VoteMate
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/journey"><i class="bi bi-map"></i> Journey</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/timeline"><i class="bi bi-calendar-event"></i> Timeline</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/booth"><i class="bi bi-geo-alt"></i> Find Booth</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> Docs</a>
                    </li>
                    <li class="nav-item ms-lg-3 me-2">
                        <button class="btn btn-outline-secondary btn-sm rounded-pill" id="lang-toggle">
                            <i class="bi bi-translate"></i> <span id="lang-toggle-text">हिंदी</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-link nav-link px-0" id="theme-toggle" aria-label="Toggle Theme">
                            <i class="bi bi-moon-fill" id="theme-icon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-5 border-top" style="background-color: var(--card-bg);">
        <div class="container text-center text-muted">
            <p class="mb-0">© 2026 VoteMate - Smart Election Guide Assistant.</p>
            <small>Empowering First-Time Voters in India.</small>
        </div>
    </footer>

    <!-- Chatbot FAB -->
    <div class="chat-fab" id="chat-fab">
        <i class="bi bi-chat-dots"></i>
    </div>

    <!-- Chatbot Window -->
    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <span><i class="bi bi-robot me-2"></i> VoteMate AI</span>
            <i class="bi bi-x-lg" id="close-chat" style="cursor:pointer;"></i>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="chat-message bot animate-fade-in">
                Hi! I am VoteMate. How can I help you with your voting journey today?
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" class="chat-input" id="chat-input" placeholder="Type your question...">
            <button class="chat-send" id="send-chat"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
