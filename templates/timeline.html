{% extends "base.html" %}

{% block content %}
<style>
.timeline {
    position: relative;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 0;
}
.timeline::after {
    content: '';
    position: absolute;
    width: 4px;
    background-color: var(--border-color);
    top: 0;
    bottom: 0;
    left: 50%;
    margin-left: -2px;
}
.timeline-item {
    padding: 10px 40px;
    position: relative;
    background-color: inherit;
    width: 50%;
}
.timeline-item.left { left: 0; }
.timeline-item.right { left: 50%; }
.timeline-item::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    right: -10px;
    background-color: var(--card-bg);
    border: 4px solid var(--primary-color);
    top: 25px;
    border-radius: 50%;
    z-index: 1;
}
.timeline-item.right::after {
    left: -10px;
}
.timeline-content {
    padding: 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    box-shadow: var(--glass-shadow);
}
@media screen and (max-width: 600px) {
    .timeline::after { left: 31px; }
    .timeline-item { width: 100%; padding-left: 70px; padding-right: 25px; }
    .timeline-item.right { left: 0; }
    .timeline-item.left::after, .timeline-item.right::after { left: 21px; }
}

#countdown {
    display: flex;
    gap: 20px;
    justify-content: center;
}
.time-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 15px 25px;
    text-align: center;
    min-width: 100px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.time-value { font-size: 2.5rem; font-weight: 700; color: var(--primary-color); line-height: 1; }
.time-label { font-size: 0.85rem; color: var(--text-color); text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
</style>

<div class="container py-5">
    <div class="text-center mb-5 animate-fade-in">
        <h2 class="fw-bold"><i class="bi bi-calendar-event text-primary"></i> Election Timeline</h2>
        <p class="text-muted">Keep track of important dates for upcoming elections in your state.</p>
        
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 col-lg-5">
                <select id="state-selector" class="form-select form-select-lg shadow-sm border-primary">
                    <optgroup label="Ongoing Elections (May 2026)">
                        <option value="wb_2026">West Bengal State Assembly</option>
                        <option value="tn_2026">Tamil Nadu State Assembly</option>
                        <option value="kerala_2026">Kerala State Assembly</option>
                    </optgroup>
                    <optgroup label="Upcoming Elections">
                        <option value="up_2027">Uttar Pradesh State Assembly (2027)</option>
                        <option value="punjab_2027">Punjab State Assembly (2027)</option>
                        <option value="gujarat_2027">Gujarat State Assembly (2027)</option>
                    </optgroup>
                    <optgroup label="Recently Completed">
                        <option value="general_2024">2024 General Elections (Lok Sabha)</option>
                        <option value="bihar_2025">Bihar State Assembly (2025)</option>
                        <option value="delhi_2025">Delhi State Assembly (2025)</option>
                    </optgroup>
                </select>
            </div>
        </div>
    </div>

    <!-- Countdown Timer -->
    <div class="mb-5 animate-fade-in" style="animation-delay: 0.2s;" id="countdown-wrapper">
        <h4 class="text-center mb-4 fw-bold" id="countdown-title">Time left until Election Day</h4>
        <div id="countdown">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="mins">00</div>
                <div class="time-label">Mins</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="secs">00</div>
                <div class="time-label">Secs</div>
            </div>
        </div>
    </div>

    <!-- Timeline -->
    <div class="timeline animate-fade-in" style="animation-delay: 0.4s;" id="timeline-container">
        <!-- Timeline items will be injected here -->
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const electionData = {
        // --- ONGOING (May 2026) ---
        "wb_2026": {
            title: "West Bengal State Assembly 2026",
            date: "May 15, 2026 08:00:00",
            status: "ongoing",
            events: [
                { date: "March 5, 2026", title: "Election Announced", desc: "ECI announces multi-phase elections for 294 seats.", color: "primary" },
                { date: "April 18, 2026", title: "Phase 1-3 Voting", desc: "Voting successfully completed in initial phases.", color: "success" },
                { date: "May 2, 2026", title: "Final Phase Voting", desc: "Voting underway in the remaining constituencies.", color: "warning" },
                { date: "May 15, 2026", title: "Results Day", desc: "Counting of votes and declaration of results.", color: "info" }
            ]
        },
        "tn_2026": {
            title: "Tamil Nadu State Assembly 2026",
            date: "May 15, 2026 08:00:00",
            status: "ongoing",
            events: [
                { date: "March 5, 2026", title: "Schedule Announced", desc: "Single-phase election announced for 234 seats.", color: "primary" },
                { date: "April 6, 2026", title: "Polling Day", desc: "Voters across the state cast their votes.", color: "success" },
                { date: "May 2, 2026", title: "Post-Poll Review", desc: "ECI reviews voting data and prepares for counting.", color: "warning" },
                { date: "May 15, 2026", title: "Results Day", desc: "Counting of votes and final tally.", color: "info" }
            ]
        },
        "kerala_2026": {
            title: "Kerala State Assembly 2026",
            date: "May 15, 2026 08:00:00",
            status: "ongoing",
            events: [
                { date: "March 5, 2026", title: "Schedule Announced", desc: "Single-phase election announced for 140 seats.", color: "primary" },
                { date: "April 6, 2026", title: "Polling Day", desc: "High voter turnout recorded.", color: "success" },
                { date: "May 2, 2026", title: "Counting Preparations", desc: "EVMs secured in strong rooms.", color: "warning" },
                { date: "May 15, 2026", title: "Results Day", desc: "Counting begins across all districts.", color: "info" }
            ]
        },

        // --- UPCOMING ---
        "up_2027": {
            title: "Uttar Pradesh State Assembly 2027",
            date: "February 20, 2027 08:00:00",
            status: "upcoming",
            events: [
                { date: "January 10, 2027", title: "Notification", desc: "ECI announces the schedule for 403 seats.", color: "primary" },
                { date: "January 25, 2027", title: "Nomination Close", desc: "Last day to file candidatures.", color: "warning" },
                { date: "February 20, 2027", title: "Voting Begins", desc: "Multi-phase polling starts.", color: "success" },
                { date: "March 15, 2027", title: "Results Declared", desc: "Final counting and results.", color: "info" }
            ]
        },
        "punjab_2027": {
            title: "Punjab State Assembly 2027",
            date: "February 15, 2027 08:00:00",
            status: "upcoming",
            events: [
                { date: "January 10, 2027", title: "Notification", desc: "Schedule announced for 117 seats.", color: "primary" },
                { date: "January 20, 2027", title: "Nomination Close", desc: "Last day for candidates to file.", color: "warning" },
                { date: "February 15, 2027", title: "Voting Day", desc: "Single-phase voting across Punjab.", color: "success" },
                { date: "March 15, 2027", title: "Results Declared", desc: "Counting and declaration of results.", color: "info" }
            ]
        },
        "gujarat_2027": {
            title: "Gujarat State Assembly 2027",
            date: "December 10, 2027 08:00:00",
            status: "upcoming",
            events: [
                { date: "November 5, 2027", title: "Notification", desc: "Schedule announced for 182 seats.", color: "primary" },
                { date: "November 15, 2027", title: "Nomination Close", desc: "Last day to file candidatures.", color: "warning" },
                { date: "December 10, 2027", title: "Voting Begins", desc: "Two-phase polling starts.", color: "success" },
                { date: "December 20, 2027", title: "Results Declared", desc: "Final counting and results.", color: "info" }
            ]
        },

        // --- COMPLETED ---
        "general_2024": {
            title: "2024 Lok Sabha Elections",
            date: "June 4, 2024 08:00:00",
            status: "completed",
            events: [
                { date: "March 16, 2024", title: "Election Scheduled", desc: "7-phase election announced for 543 Lok Sabha seats.", color: "primary" },
                { date: "April 19 - June 1, 2024", title: "Voting Period", desc: "Polling held across the country in 7 phases.", color: "success" },
                { date: "June 4, 2024", title: "Results Declared", desc: "NDA secures 293 seats, forming the government. INDIA bloc secures 234 seats.", color: "info" }
            ]
        },
        "bihar_2025": {
            title: "Bihar State Assembly 2025",
            date: "November 10, 2025 08:00:00",
            status: "completed",
            events: [
                { date: "September 25, 2025", title: "Election Scheduled", desc: "Schedule announced for 243 assembly seats.", color: "primary" },
                { date: "October 20 - Nov 5, 2025", title: "Voting Period", desc: "Multi-phase polling conducted across Bihar.", color: "success" },
                { date: "November 10, 2025", title: "Results Declared", desc: "Final tally announced and new government formed.", color: "info" }
            ]
        },
        "delhi_2025": {
            title: "Delhi State Assembly 2025",
            date: "February 11, 2025 08:00:00",
            status: "completed",
            events: [
                { date: "January 6, 2025", title: "Election Scheduled", desc: "Schedule announced for 70 assembly seats.", color: "primary" },
                { date: "February 8, 2025", title: "Voting Day", desc: "Single-phase polling conducted in Delhi.", color: "success" },
                { date: "February 11, 2025", title: "Results Declared", desc: "Counting concluded and final results announced.", color: "info" }
            ]
        }
    };

    let countdownInterval;

    function renderTimeline(stateKey) {
        const data = electionData[stateKey];
        
        // Update Title
        if(data.status === 'completed') {
            document.getElementById('countdown-title').innerText = `Results for ${data.title}`;
        } else {
            document.getElementById('countdown-title').innerText = `Time left until ${data.title} Day`;
        }
        
        // Render Timeline Events
        const container = document.getElementById('timeline-container');
        container.innerHTML = '';
        
        data.events.forEach((ev, idx) => {
            const side = idx % 2 === 0 ? 'left' : 'right';
            const html = `
                <div class="timeline-item ${side}">
                    <div class="timeline-content">
                        <h5 class="fw-bold text-${ev.color}">${ev.date}</h5>
                        <h6 class="fw-bold mb-2">${ev.title}</h6>
                        <p class="text-muted mb-0">${ev.desc}</p>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });

        // Setup Countdown / Completed state
        if (countdownInterval) clearInterval(countdownInterval);
        
        const targetDate = new Date(data.date).getTime();
        const countdownWrapper = document.getElementById("countdown-wrapper");
        const countdownDiv = document.getElementById("countdown");
        
        if (data.status === 'completed') {
            countdownDiv.innerHTML = `
                <div class="card border-success border-2 shadow-sm bg-success-subtle w-100 mt-2">
                    <div class="card-body py-4">
                        <h3 class='text-success fw-bold mb-2'><i class="bi bi-check-circle-fill"></i> Election Completed</h3>
                        <p class="mb-0 text-dark">The democratic process has concluded. See the timeline below for the final results and historical dates.</p>
                    </div>
                </div>
            `;
            return;
        } else if (data.status === 'ongoing') {
            countdownDiv.innerHTML = `
                <div class="card border-primary border-2 shadow-sm bg-primary-subtle w-100 mt-2">
                    <div class="card-body py-4">
                        <h3 class='text-primary fw-bold mb-2'>
                            <span class="spinner-grow spinner-grow-sm me-2" role="status" aria-hidden="true"></span>
                            Election is Ongoing
                        </h3>
                        <p class="mb-0 text-dark">Voting or counting is currently in progress. Check the timeline for the latest scheduled events.</p>
                    </div>
                </div>
            `;
            return;
        }

        // Reset HTML if it was showing 'Election Completed' or 'Election Day is Here'
        countdownDiv.innerHTML = `
            <div class="time-box"><div class="time-value" id="days">00</div><div class="time-label">Days</div></div>
            <div class="time-box"><div class="time-value" id="hours">00</div><div class="time-label">Hours</div></div>
            <div class="time-box"><div class="time-value" id="mins">00</div><div class="time-label">Mins</div></div>
            <div class="time-box"><div class="time-value" id="secs">00</div><div class="time-label">Secs</div></div>
        `;

        countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                countdownDiv.innerHTML = "<h3 class='text-success fw-bold'>Election Day is Here!</h3>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const dEl = document.getElementById("days");
            if(dEl) {
                dEl.innerHTML = days < 10 ? '0'+days : days;
                document.getElementById("hours").innerHTML = hours < 10 ? '0'+hours : hours;
                document.getElementById("mins").innerHTML = minutes < 10 ? '0'+minutes : minutes;
                document.getElementById("secs").innerHTML = seconds < 10 ? '0'+seconds : seconds;
            }
        }, 1000);
    }

    document.getElementById('state-selector').addEventListener('change', (e) => {
        renderTimeline(e.target.value);
    });

    // Init with general
    renderTimeline('general');
</script>
{% endblock %}
